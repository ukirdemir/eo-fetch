[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eo-fetch"
dynamic = ["version"]  # read from eo_fetch.__version__ (src/eo_fetch/__init__.py)
description = "One search-and-download interface, with verified downloads and manifests, for Earth-observation and climate data providers."
readme = "packaging/README_PYPI.md"  # the package page; README.md is the longer GitHub version
requires-python = ">=3.12,<3.14"  # the earthkit packages have no wheels for 3.14 yet
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Umut Kirdemir" }]
keywords = [
    "earth observation",
    "climate",
    "satellite",
    "download",
    "meteorology",
    "EUMETSAT",
    "NASA",
    "Copernicus",
    "ERA5",
    "CMIP",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
]
# One install gives everything: all providers, readers and plots.
dependencies = [
    # core
    "requests",
    "truststore",
    # providers
    "eumdac",
    "earthaccess",
    "pystac-client",
    "planetary-computer",
    "s3fs",
    "cdsapi",
    "ecmwf-opendata",
    "copernicusmarine",
    "intake-esgf",
    # readers, regridding and plots
    "numpy",
    "xarray",
    "netcdf4",
    "h5netcdf",
    "h5py",
    "zarr",
    "rioxarray",
    "pyproj",
    "pyresample",
    "satpy",
    "eccodes",
    "earthkit-data",
    "earthkit-plots",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build", "twine"]

[project.scripts]
eo-fetch = "eo_fetch.cli:main"

[tool.setuptools.dynamic]
version = { attr = "eo_fetch.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access",
    "account: needs provider credentials",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ISC"]
